[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docuwizard"
version = "0.1.0"
description = "Local RAG document Q&A desktop app (PySide6)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DocuWizard contributors" }]
dependencies = [
  "PySide6>=6.6",
  "platformdirs>=4.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.scripts]
docuwizard = "docuwizard.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docuwizard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
